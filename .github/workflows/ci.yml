name: CI

on:
  push:
  pull_request:

jobs:
  python-and-wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
        python: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - uses: actions/upload-artifact@v4
        with:
          name: dozeguard-wheel-py${{ matrix.python }}-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error

  distribution-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu:24.04, debian:stable-slim, fedora:latest, archlinux:latest, opensuse/tumbleweed]
    steps:
      - uses: actions/checkout@v4
      - name: Run unit suite in distribution container
        env:
          DISTRO_IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD:/src" -e DISTRO_IMAGE "$DISTRO_IMAGE" /bin/sh -ec '
            case "$DISTRO_IMAGE" in
              ubuntu:*|debian:*) apt-get update; apt-get install -y python3 python3-venv python3-pip gcc python3-dev ;;
              fedora:*) dnf -y install python3 python3-pip python3-devel gcc ;;
              archlinux:*) pacman -Syu --noconfirm python python-pip python-setuptools gcc ;;
              opensuse/*) zypper --non-interactive refresh; zypper --non-interactive install python3 python3-pip python3-devel gcc ;;
            esac
            python3 -m venv /tmp/dg-venv
            /tmp/dg-venv/bin/pip install /src/.[test]
            cd /src
            /tmp/dg-venv/bin/python -m pytest -q
          '

  deb-packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian
            image: debian:stable-slim
          - distro: ubuntu
            image: ubuntu:24.04
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Build, install, exercise, and remove DEB
        run: |
          apt-get update
          apt-get install -y build-essential debhelper-compat dh-python pybuild-plugin-pyproject desktop-file-utils python3-all python3-setuptools python3-wheel python3-psutil python3-dbus-next
          desktop-file-validate dozeguard-tray.desktop dozeguard-tray-autostart.desktop
          dpkg-buildpackage -us -uc -b
          ! dpkg-deb -c ../dozeguard_1.0.0-1_all.deb | grep -E 'dozeguard-tray.desktop|xdg/autostart'
          dpkg-deb -c ../dozeguard-tray_1.0.0-1_all.deb | grep -F 'xdg/autostart/dozeguard-tray.desktop'
          cp ../dozeguard_1.0.0-1_all.deb /tmp/dozeguard-v1-core.deb
          cp ../dozeguard-tray_1.0.0-1_all.deb /tmp/dozeguard-v1-tray.deb
          sed -i '1s/1.0.0-1/1.0.0-2/' debian/changelog
          dpkg-buildpackage -us -uc -b
          apt-get install -y /tmp/dozeguard-v1-core.deb /tmp/dozeguard-v1-tray.deb
          dozeguard --help
          dozeguard-tray --help
          xdg_config_home="${XDG_CONFIG_HOME:-$HOME/.config}"
          dozeguard-tray --disable-autostart
          grep -Fx 'Hidden=true' "$xdg_config_home/autostart/dozeguard-tray.desktop"
          dozeguard-tray --enable-autostart
          grep -Fx 'Hidden=false' "$xdg_config_home/autostart/dozeguard-tray.desktop"
          python3 -c 'import main, daemon, controller, backends.linux, core.session'
          test -f /usr/share/applications/dozeguard-tray.desktop
          test -f /etc/xdg/autostart/dozeguard-tray.desktop
          dpkg-query -W -f='${Version}\n' dozeguard-tray | grep -Fx '1.0.0-1'
          apt-get install -y ../dozeguard_1.0.0-2_all.deb ../dozeguard-tray_1.0.0-2_all.deb
          dpkg-query -W -f='${Version}\n' dozeguard | grep -Fx '1.0.0-2'
          dpkg-query -W -f='${Version}\n' dozeguard-tray | grep -Fx '1.0.0-2'
          apt-get remove -y dozeguard-tray dozeguard
          test ! -e /usr/bin/dozeguard
          test ! -e /usr/bin/dozeguard-tray
          test ! -e /usr/share/applications/dozeguard-tray.desktop
          test ! -e /etc/xdg/autostart/dozeguard-tray.desktop
          mkdir -p dist
          cp ../dozeguard_1.0.0-2_all.deb ../dozeguard-tray_1.0.0-2_all.deb dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dozeguard-1.0.0-deb-${{ matrix.distro }}
          path: dist/*.deb
          if-no-files-found: error

  fedora-rpm:
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build, install, exercise, and remove RPM
        run: |
          dnf -y install git rpm-build desktop-file-utils python3-devel python3-setuptools python3-pip python3-wheel python3-psutil python3-dbus-next
          desktop-file-validate dozeguard-tray.desktop dozeguard-tray-autostart.desktop
          mkdir -p /root/rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          repo_dir="${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is required}"
          source_commit="${GITHUB_SHA:?GITHUB_SHA is required}"
          test -f "$repo_dir/dozeguard.spec"
          tar -C "$repo_dir" --exclude=.git --transform="s|^\./|DozeGuard-${source_commit}/|" -czf "/root/rpmbuild/SOURCES/${source_commit}.tar.gz" .
          cp "$repo_dir/dozeguard-tray.desktop" /root/rpmbuild/SOURCES/dozeguard-tray.desktop
          cp "$repo_dir/dozeguard-tray-autostart.desktop" /root/rpmbuild/SOURCES/dozeguard-tray-autostart.desktop
          rpmbuild --define '_topdir /root/rpmbuild' --define "sourcecommit ${source_commit}" -ba "$repo_dir/dozeguard.spec"
          ! rpm -qpl /root/rpmbuild/RPMS/noarch/dozeguard-1.0.0-1*.noarch.rpm | grep -E 'dozeguard-tray.desktop|xdg/autostart'
          rpm -qpl /root/rpmbuild/RPMS/noarch/dozeguard-tray-1.0.0-1*.noarch.rpm | grep -F 'xdg/autostart/dozeguard-tray.desktop'
          cp /root/rpmbuild/RPMS/noarch/dozeguard-1.0.0-1*.noarch.rpm /tmp/dozeguard-v1-core.rpm
          cp /root/rpmbuild/RPMS/noarch/dozeguard-tray-1.0.0-1*.noarch.rpm /tmp/dozeguard-v1-tray.rpm
          sed -e 's/^Release:.*/Release: 2%{?dist}/' -e 's/1.0.0-1$/1.0.0-2/' "$repo_dir/dozeguard.spec" > /tmp/dozeguard-release2.spec
          rpmbuild --define '_topdir /root/rpmbuild' --define "sourcecommit ${source_commit}" -ba /tmp/dozeguard-release2.spec
          dnf -y install /tmp/dozeguard-v1-core.rpm /tmp/dozeguard-v1-tray.rpm
          dozeguard --help
          dozeguard-tray --help
          xdg_config_home="${XDG_CONFIG_HOME:-$HOME/.config}"
          dozeguard-tray --disable-autostart
          grep -Fx 'Hidden=true' "$xdg_config_home/autostart/dozeguard-tray.desktop"
          dozeguard-tray --enable-autostart
          grep -Fx 'Hidden=false' "$xdg_config_home/autostart/dozeguard-tray.desktop"
          python3 -c 'import main, daemon, controller, backends.linux, core.session'
          test -f /usr/share/applications/dozeguard-tray.desktop
          test -f /etc/xdg/autostart/dozeguard-tray.desktop
          rpm -q dozeguard-tray
          dnf -y install /root/rpmbuild/RPMS/noarch/dozeguard-1.0.0-2*.noarch.rpm /root/rpmbuild/RPMS/noarch/dozeguard-tray-1.0.0-2*.noarch.rpm
          rpm -q --qf '%{RELEASE}\n' dozeguard | grep '^2\.'
          rpm -q --qf '%{RELEASE}\n' dozeguard-tray | grep '^2\.'
          dnf -y remove dozeguard-tray dozeguard
          test ! -e /usr/bin/dozeguard
          test ! -e /usr/bin/dozeguard-tray
          test ! -e /usr/share/applications/dozeguard-tray.desktop
          test ! -e /etc/xdg/autostart/dozeguard-tray.desktop
          mkdir -p dist
          cp /root/rpmbuild/RPMS/noarch/dozeguard-1.0.0-2*.noarch.rpm /root/rpmbuild/RPMS/noarch/dozeguard-tray-1.0.0-2*.noarch.rpm dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dozeguard-1.0.0-rpm-fedora
          path: dist/*.rpm
          if-no-files-found: error

  arch-package:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build, install, exercise, and remove Arch package
        run: |
          pacman -Syu --noconfirm base-devel git desktop-file-utils python python-pip python-build python-installer python-setuptools python-wheel python-psutil python-dbus-next pyside6
          desktop-file-validate dozeguard-tray.desktop dozeguard-tray-autostart.desktop
          useradd -m builder
          repo_dir="${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is required}"
          test -f "$repo_dir/PKGBUILD"
          tar -C "$repo_dir" \
            --exclude=.git \
            --exclude=.Doze-env \
            --exclude=.venv \
            --exclude=build \
            --exclude=dist \
            --exclude=.pytest_cache \
            --exclude='*.egg-info' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --transform='s|^\./|dozeguard/|' \
            -czf /tmp/dozeguard-source.tar.gz .
          
          build_dir="$(mktemp -d)"
          cp "$repo_dir/PKGBUILD" "$build_dir/PKGBUILD"
          sed -E \
            -e 's|^source=.*$|source=("dozeguard-source.tar.gz::file:///tmp/dozeguard-source.tar.gz")|' \
            "$build_dir/PKGBUILD" > "$build_dir/PKGBUILD.new"
          mv "$build_dir/PKGBUILD.new" "$build_dir/PKGBUILD"
          chown -R builder:builder "$build_dir"
          runuser -u builder -- /bin/bash -ec "cd '$build_dir' && makepkg --syncdeps --noconfirm --cleanbuild"
          ! bsdtar -tf "$build_dir"/dozeguard-1.0.0-1-any.pkg.tar.zst | grep -E 'dozeguard-tray.desktop|xdg/autostart'
          bsdtar -tf "$build_dir"/dozeguard-tray-1.0.0-1-any.pkg.tar.zst | grep -F 'etc/xdg/autostart/dozeguard-tray.desktop'
          cp "$build_dir"/dozeguard-1.0.0-1-any.pkg.tar.zst /tmp/dozeguard-v1-core.pkg.tar.zst
          cp "$build_dir"/dozeguard-tray-1.0.0-1-any.pkg.tar.zst /tmp/dozeguard-v1-tray.pkg.tar.zst
          sed 's/^pkgrel=1$/pkgrel=2/' "$build_dir"/PKGBUILD > "$build_dir"/PKGBUILD.new
          mv "$build_dir"/PKGBUILD.new "$build_dir"/PKGBUILD
          chown builder:builder "$build_dir"/PKGBUILD
          runuser -u builder -- /bin/bash -ec "cd '$build_dir' && makepkg --syncdeps --noconfirm --cleanbuild"
          pacman -U --noconfirm /tmp/dozeguard-v1-core.pkg.tar.zst /tmp/dozeguard-v1-tray.pkg.tar.zst
          dozeguard --help
          dozeguard-tray --help
          xdg_config_home="${XDG_CONFIG_HOME:-$HOME/.config}"
          dozeguard-tray --disable-autostart
          grep -Fx 'Hidden=true' "$xdg_config_home/autostart/dozeguard-tray.desktop"
          dozeguard-tray --enable-autostart
          grep -Fx 'Hidden=false' "$xdg_config_home/autostart/dozeguard-tray.desktop"
          python -c 'import main, daemon, controller, backends.linux, core.session'
          test -f /usr/share/applications/dozeguard-tray.desktop
          test -f /etc/xdg/autostart/dozeguard-tray.desktop
          pacman -U --noconfirm "$build_dir"/dozeguard-1.0.0-2-any.pkg.tar.zst "$build_dir"/dozeguard-tray-1.0.0-2-any.pkg.tar.zst
          pacman -Q dozeguard | grep -F '1.0.0-2'
          pacman -Q dozeguard-tray | grep -F '1.0.0-2'
          pacman -Rns --noconfirm dozeguard-tray dozeguard
          test ! -e /usr/bin/dozeguard
          test ! -e /usr/bin/dozeguard-tray
          test ! -e /usr/share/applications/dozeguard-tray.desktop
          test ! -e /etc/xdg/autostart/dozeguard-tray.desktop
          mkdir -p dist
          cp "$build_dir"/dozeguard-1.0.0-2-any.pkg.tar.zst "$build_dir"/dozeguard-tray-1.0.0-2-any.pkg.tar.zst dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dozeguard-1.0.0-arch
          path: dist/*.pkg.tar.zst
          if-no-files-found: error
